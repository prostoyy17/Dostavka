name: MayrMarket
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MayrMarket:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.mayrmarket.preview
        INFOPLIST_KEY_CFBundleDisplayName: MayrMarket
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Сфотографировать вход для курьера.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  MarketUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MayrMarket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.mayrmarket.preview.uitests
        TEST_TARGET_NAME: MayrMarket
schemes:
  MayrMarket:
    build:
      targets:
        MayrMarket: all
    test:
      targets: [MarketUITests]
