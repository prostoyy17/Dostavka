<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка связи с магазином</title>
<style>
:root{font:17px/1.45 system-ui,sans-serif;color:#0e1433;background:#eeede8}main{max-width:32rem;margin:8vh auto;padding:1.4rem;background:white;border-radius:1.3rem}h1{font-size:1.5rem;margin-top:0}button{font:inherit;color:white;background:#0033b0;border:0;border-radius:.8rem;padding:.8rem 1.1rem}button:disabled{opacity:.55}#result{white-space:pre-line}
</style><main><h1>Проверка связи с магазином</h1><p>Проверим, проходит ли запрос с этого телефона на адрес оформления заказа. Корзина и личные данные не используются.</p><button id="run">Проверить связь</button><p id="result" role="status"></p></main>
<script>
const run = document.querySelector('#run'), result = document.querySelector('#result');
run.onclick = async () => {
  run.disabled = true;
  result.textContent = 'Проверяем…';
  const controller = new AbortController();
  const start = performance.now(), timer = setTimeout(() => controller.abort(), 15000);
  try {
    const body = new FormData();
    body.set('connection_check', '1');
    const response = await fetch('https://mayrmarket-order-test.zanyburl3.chatgpt.site/orders', {method:'POST', body, signal:controller.signal, credentials:'omit'});
    const elapsed = ((performance.now() - start)/1000).toFixed(1);
    result.textContent = response.status === 400 ? 'Связь есть. Обработчик ответил за '+elapsed+' с. Заказ не создавался.' :
      'Сервер ответил кодом '+response.status+' за '+elapsed+' с. Проверка не подтверждена.';
  } catch {
    result.textContent = controller.signal.aborted ? 'За 15 секунд ответ не получен.' : 'Браузер не получил доступного ответа от обработчика заказа.';
  } finally { clearTimeout(timer); run.disabled = false; }
};
</script></html>
