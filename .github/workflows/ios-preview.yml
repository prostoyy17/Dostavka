name: Native iPhone simulator preview
on:
  push:
    branches: [ios/simulator-preview]
    paths: ['ios/**', '.github/workflows/ios-preview.yml']
permissions:
  contents: write
jobs:
  preview:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        working-directory: ios
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Boot iPhone, build and record real UI test
        working-directory: ios
        run: bash record.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MayrMarket-iPhone
          path: ios/output/
          if-no-files-found: error
      - name: Publish the verified simulator media on the preview branch
        run: |
          mkdir -p preview/native-store
          cp ios/output/* preview/native-store/
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add preview/native-store
          git commit -m "Save iOS simulator walkthrough"
          git push
