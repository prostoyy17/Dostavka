<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MayrMarket — доставка продуктов по Грозному</title>
  <meta name="description" content="Доставка продуктов по Грозному">
  <meta name="theme-color" content="#0033B0">
  <link rel="icon" href="assets/icons/cart.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=1794426410">
</head>
<body>
  <header class="top">
    <div class="top__inner">
      <!-- Логотип скрыт по просьбе владельца (не удалён): вернуть — убрать атрибут hidden -->
      <a class="logo" href="#/" hidden>
        <span class="logo__mark">M</span>
        <span class="logo__text">Mayr<b>Market</b></span>
      </a>
      <!-- Выбор склада: пока складов нет, здесь доставка по Грозному. Выбор складов включается в data.js (WAREHOUSES_ENABLED) -->
      <button class="loc" data-action="open-points">
        <span class="loc__title"><span id="pointCity">Доставка по Грозному</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m6 9 6 6 6-6"/></svg></span>
        <span class="loc__meta"><i class="loc__dot" id="pointDot"></i><span id="pointMeta"></span></span>
      </button>
      <label class="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="Найти товар" autocomplete="off">
      </label>
      <nav class="top__actions">
        <a class="round-btn" href="#/favorites" data-nav="favorites" title="Избранное">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7.5-4.6-9.3-9.2C1.4 7.4 3.6 4 7 4c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8C19.5 15.4 12 20 12 20z"/></svg>
          <span class="badge" data-fav-count hidden>0</span>
        </a>
        <a class="round-btn" href="#/orders" data-nav="orders" title="Заказы">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
          <span class="badge badge--dot" data-orders-dot hidden></span>
        </a>
        <button class="round-btn" data-action="toggle-theme" title="Тема">
          <svg class="i-sun" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <a class="round-btn" href="#/account" data-nav="account" title="Аккаунт">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.4-7 8-7s7 2.5 8 7"/></svg>
        </a>
        <button class="cart-pill" data-action="open-cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
          <span data-cart-total>Корзина</span>
        </button>
      </nav>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav class="cats" id="catNav"></nav>
      <div class="point-card" id="pointCard"></div>
    </aside>

    <main class="main" id="page"></main>

    <aside class="side-cart" id="sideCart"></aside>
  </div>

  <nav class="tabbar">
    <a href="#/" data-nav="catalog">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Главная</span>
    </a>
    <a href="#/favorites" data-nav="favorites">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7.5-4.6-9.3-9.2C1.4 7.4 3.6 4 7 4c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8C19.5 15.4 12 20 12 20z"/></svg>
      <span>Избранное</span>
      <i class="badge" data-fav-count hidden>0</i>
    </a>
    <a href="#/orders" data-nav="orders">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
      <span>Заказы</span>
      <i class="badge badge--dot" data-orders-dot hidden></i>
    </a>
    <button data-action="open-cart">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20.5" r="1.3"/><circle cx="17" cy="20.5" r="1.3"/></svg>
      <span data-cart-total>Корзина</span>
      <i class="badge" data-cart-count hidden>0</i>
    </button>
    <a href="#/account" data-nav="account">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.4-7 8-7s7 2.5 8 7"/></svg>
      <span>Аккаунт</span>
    </a>
  </nav>

  <div class="overlay" id="overlay"></div>
  <div class="drawer" id="drawer" role="dialog" aria-modal="true"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  <div class="toasts" id="toasts"></div>

  <script>window.APP_BUILD="1794426410"</script>
  <script src="data/catalog.js?v=1794426410"></script>
  <script src="data/photos.js?v=1794426410"></script>
  <script src="data.js?v=1794426410"></script>
  <script src="app.js?v=1794426410"></script>
</body>
</html>
