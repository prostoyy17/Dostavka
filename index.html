<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Склад 95 — доставка продуктов</title>
  <meta name="description" content="Доставка продуктов в Грозном, Урус-Мартане и Шали">
  <meta name="theme-color" content="#14a05c">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="header__inner container">
      <a class="logo" href="#" data-action="home">
        <span class="logo__mark">95</span>
        <span class="logo__text">Склад</span>
      </a>

      <button class="point-chip" data-action="open-points">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <span class="point-chip__body">
          <span class="point-chip__city" id="pointCity">Выберите точку</span>
          <span class="point-chip__meta" id="pointMeta"></span>
        </span>
        <svg class="point-chip__arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
      </button>

      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="Найти продукты" autocomplete="off">
        <kbd>/</kbd>
      </label>

      <nav class="header__actions">
        <button class="icon-btn" data-action="open-favs" title="Избранное">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7.5-4.6-9.3-9.2C1.4 7.4 3.6 4 7 4c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8C19.5 15.4 12 20 12 20z"/></svg>
          <span class="badge" id="favBadge" hidden>0</span>
        </button>
        <button class="icon-btn" data-action="open-orders" title="Заказы">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
          <span class="badge badge--dot" id="ordersBadge" hidden></span>
        </button>
        <button class="icon-btn" data-action="toggle-theme" title="Тема">
          <svg class="i-sun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="cart-btn" data-action="open-cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20.5" r="1.3"/><circle cx="17" cy="20.5" r="1.3"/></svg>
          <span id="cartBtnText">Корзина</span>
        </button>
      </nav>
    </div>
  </header>

  <div class="layout container">
    <aside class="sidebar">
      <nav class="cats" id="catNav"></nav>
      <div class="point-card" id="pointCard"></div>
    </aside>

    <main class="main">
      <section class="banners" id="banners"></section>

      <div class="cat-strip" id="catStrip"></div>

      <div class="toolbar">
        <h1 class="toolbar__title" id="listTitle">Все товары</h1>
        <div class="toolbar__controls">
          <div class="chips" id="filterChips">
            <button class="chip" data-filter="sale">% Скидки</button>
            <button class="chip" data-filter="halal">Халяль</button>
            <button class="chip" data-filter="local">Местное</button>
            <button class="chip" data-filter="instock">В наличии</button>
          </div>
          <select id="sortSelect" class="select">
            <option value="pop">Популярные</option>
            <option value="asc">Сначала дешевле</option>
            <option value="desc">Сначала дороже</option>
            <option value="sale">По скидке</option>
            <option value="name">По названию</option>
          </select>
        </div>
      </div>

      <div id="catalog"></div>
    </main>

    <aside class="side-cart" id="sideCart"></aside>
  </div>

  <footer class="footer">
    <div class="container footer__inner">
      <div class="logo logo--sm"><span class="logo__mark">95</span><span class="logo__text">Склад</span></div>
      <div class="footer__points" id="footerPoints"></div>
      <div class="footer__copy">© 2026 Склад 95</div>
    </div>
  </footer>

  <button class="mobile-cart" id="mobileCart" data-action="open-cart" hidden>
    <span class="mobile-cart__eta" id="mobileEta"></span>
    <span class="mobile-cart__label">Корзина</span>
    <span class="mobile-cart__sum" id="mobileSum"></span>
  </button>

  <div class="overlay" id="overlay"></div>
  <div class="drawer" id="drawer" role="dialog" aria-modal="true"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  <div class="toasts" id="toasts"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
